<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stealth Checkout: merchant dashboard</title>
  <style>
    /* Hidden means hidden. [hidden] is display:none in the browser's own
       stylesheet, and any author rule that sets display beats it: one
       label{display:block} left an Amount field on screen for a counter code
       that has no amount, and left the previous code's QR sitting under a form
       that had moved on, which is how a shop prints the wrong one. */
    [hidden] { display: none !important; }
    :root { --bg:#07080c; --panel:#111318; --line:#2a2e37; --fg:#e8eaf0; --muted:#9aa1ad;
      --green:#7ee787; --red:#ff7b72; --yellow:#f0c674; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
      font:14px/1.5 system-ui,sans-serif; padding:28px 16px; display:flex; justify-content:center; }
    .wrap { width:100%; max-width:860px; }
    h1 { font-size:26px; margin:0; line-height:1.2; }
    /* A transaction hash in the table is something you click. WCAG 2.5.8
       wants 24px and these were 13. */
    td a { display:inline-block; min-height:24px; line-height:24px; }
    .muted { color:var(--muted); font-size:12.5px; }
    .bar { display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin:16px 0; }
    label { font-size:11.5px; color:var(--muted); display:block; }
    /* 44px on everything a finger aims at. These were 33. */
    input { display:block; margin-top:3px; padding:11px 10px; min-height:44px; border:1px solid var(--line);
      border-radius:8px; background:var(--panel); color:var(--fg); font-size:13px; }
    #f-id { width:110px; } #f-token { width:150px; } #f-amount { width:90px; } #f-to { width:270px; } #f-watcher { width:210px; }
    button { padding:11px 16px; min-height:44px; border:0; border-radius:8px; cursor:pointer;
      background:var(--green); color:#08110a; font-weight:700; font-size:13px; }
    button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th { text-align:left; color:var(--muted); font-size:11px; letter-spacing:1px;
      border-bottom:1px solid var(--line); padding:6px 8px; }
    td { padding:8px; border-bottom:1px solid #1a1d24; font-family:ui-monospace,monospace; font-size:12.5px; }
    .badge { padding:2px 8px; border-radius:5px; font-size:10.5px; font-weight:700; }
    .b-watching { background:#332f1c; color:var(--yellow); }
    .b-paid { background:#22321f; color:var(--green); }
    .b-expired { background:#3d2a2a; color:var(--red); }
    .b-attention { background:#3a2f18; color:var(--yellow); border:1px solid var(--yellow); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    button:disabled { opacity:.5; cursor:progress; }
    .scroll { overflow-x:auto; }
    @media (max-width:640px) {
      body { padding:16px 10px; }
      .bar > div, .bar input { width:100%; }
      #f-id, #f-token, #f-amount, #f-to, #f-watcher, #f-expires { width:100%; }
      .bar button { flex:1 1 45%; min-height:44px; }
    }
    .note { margin-top:14px; padding:10px 12px; border:1px dashed var(--line); border-radius:8px;
      color:var(--muted); font-size:12px; }
    a { color:var(--green); }
    /* A payment QR is always dark-on-light, whatever the surrounding theme. */
    #qr-dialog { border:1px solid #2a2e37; border-radius:12px; background:#111318; color:#e8eaf0;
      padding:18px; max-width:340px; }
    #qr-dialog::backdrop { background:rgba(0,0,0,.6); }
    #qr-body { display:flex; flex-direction:column; gap:10px; align-items:center; }
    #qr-body .qr { background:#fff; padding:12px; border-radius:10px; }
    #qr-body img { display:block; width:240px; max-width:100%; height:auto; image-rendering:pixelated; }
    #qr-body .meta { font-size:12px; color:#9aa1ad; text-align:center; word-break:break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Merchant dashboard</h1>
    <div class="muted">Invoices watched by <code>server/watcher</code>: create, track, get paid privately.</div>

    <div class="bar">
      <div><label>Watcher URL</label><input id="f-watcher" value="http://127.0.0.1:8787" /></div>
      <div><label>Watcher token</label><input id="f-token" type="password" placeholder="WATCHER_TOKEN"
        autocomplete="off" autocorrect="off" spellcheck="false" /></div>
      <div><label>Invoice id</label><input id="f-id" placeholder="auto" /></div>
      <div><label>Amount (STRK)</label><input id="f-amount" value="2" /></div>
      <div><label>Receive address (fresh per invoice)</label><input id="f-to" placeholder="0x…" /></div>
      <div><label>Expires in (hours, blank = never)</label><input id="f-expires" placeholder="24" /></div>
      <button id="f-create">Create invoice</button>
      <button id="f-refresh" class="ghost">Refresh</button>
      <button id="f-export" class="ghost">Export CSV</button>
    </div>

    <div id="status" class="muted" role="status" aria-live="polite"></div>
    <div class="scroll">
      <table>
        <thead><tr><th>ID</th><th>AMOUNT</th><th>RECEIVED</th><th>RECEIVE ADDRESS</th><th>STATUS</th><th>TX</th><th>PAY LINK</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="note" id="demo-note" hidden>
      Watcher unreachable: showing <strong>demo data</strong>. Start it with
      <code>node server/watcher/watcher.mjs</code> and refresh.
    </div>
  </div>
  <!-- Shown by the QR button on a row. A dialog rather than a table cell,
       because a code small enough to sit in a row is a code that will not scan. -->
  <dialog id="qr-dialog">
    <div id="qr-body"></div>
    <form method="dialog"><button class="ghost">Close</button></form>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
