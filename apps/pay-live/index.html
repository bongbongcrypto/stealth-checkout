<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stealth Checkout: pay an invoice privately</title>
  <style>
    /* Hidden means hidden. [hidden] is display:none in the browser's own
       stylesheet, and any author rule that sets display beats it: one
       label{display:block} left an Amount field on screen for a counter code
       that has no amount, and left the previous code's QR sitting under a form
       that had moved on, which is how a shop prints the wrong one. */
    [hidden] { display: none !important; }
    :root { --bg:#07080c; --panel:#111318; --line:#2a2e37; --fg:#e8eaf0; --muted:#9aa1ad; --green:#7ee787; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
      font:14px/1.5 system-ui,sans-serif; display:flex; justify-content:center; padding:24px 16px; }
    #app { width:100%; max-width:420px; }
    h1 { font-size:26px; margin:0 0 6px; line-height:1.2; }
    .muted { color:var(--muted); font-size:13px; }
    .small { font-size:11.5px; margin-top:14px; }
    a { color:var(--green); }
    label { display:block; margin-top:12px; font-size:12.5px; color:var(--muted); }
    /* 44px on anything a finger aims at. The select was arriving unstyled at
       19px tall, which is half the minimum. */
    input, select { width:100%; margin-top:4px; padding:11px 10px; min-height:44px;
      border:1px solid var(--line); border-radius:8px; background:var(--panel);
      color:var(--fg); font-size:14px; font-family:inherit; }
    select { appearance:none; cursor:pointer;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
        linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
      background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px; }
    button { margin-top:14px; padding:12px 18px; min-height:44px; border:0; border-radius:8px;
      cursor:pointer; background:var(--green); color:#08110a; font-weight:700; font-size:14px; }
    .out { margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:8px;
      word-break:break-all; font-size:12.5px; display:flex; flex-direction:column; gap:8px; }
    .out button { margin:0; align-self:flex-start; padding:10px 14px; min-height:44px; }
    #checkout { margin-top:16px; }
    .check { margin-top:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
      font-size:12.5px; color:var(--muted); }
    .check.good { border-color:var(--green); color:var(--green); }
    .check.bad { border-color:#ff7b72; color:#ff7b72; }
    /* A QR is always dark-on-light, whatever the page theme. Inverting one to
       suit a dark background is the most common way to ship a code that does
       not read. */
    .qr { background:#fff; padding:12px; border-radius:10px; display:inline-flex;
      flex-direction:column; gap:6px; align-items:center; align-self:flex-start; }
    .qr img { display:block; width:220px; max-width:100%; height:auto; image-rendering:pixelated; }
    .qr .cap { color:#333; font-size:11px; text-align:center; max-width:220px; overflow-wrap:anywhere; }
    .row { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    /* A disclosure control is something a finger aims at. */
    .hop-summary { min-height:44px; display:flex; align-items:center; cursor:pointer; }
    /* A phone has less height to spend, and 32px of it at the top was the
       last thing keeping the pay button off the first screen. */
    @media (max-width: 480px) {
      body { padding:16px 12px; }
      h1 { font-size:23px; }
    }
    #print-area { display:none; }
    @media print {
      body > * { display:none !important; }
      body > #print-area { display:block !important; }
      body { background:#fff; color:#000; padding:0; }
      #print-area .qr { padding:0; }
      #print-area img { width:min(74mm, 100%); }
      #print-area h2 { font:700 18px system-ui,sans-serif; margin:0 0 4px; }
      #print-area p { font:12px system-ui,sans-serif; color:#333; margin:2px 0; word-break:break-all; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- Filled by the Print button; hidden on screen, and the only thing printed. -->
  <div id="print-area"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
